<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>buddykit — gallery</title>
<style>
  :root {
    --paper: #f7f2ea; --ink: #291f16; --ink-soft: #6b5d4d; --hairline: #e0d5c4;
    --card: #fffdf9; --accent: #cc7a3a; --mono: ui-monospace, Menlo, monospace;
    --sys: system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #1d1813; --ink: #ede4d7; --ink-soft: #a2937f; --hairline: #383026; --card: #262019; --accent: #e08b47; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 var(--sys); }
  .wrap { max-width: 74rem; margin: 0 auto; padding: 2.5rem 1.2rem 5rem; }
  h1 { font-weight: 750; letter-spacing: -.01em; margin: 0 0 .2rem; }
  .sub { color: var(--ink-soft); margin: 0 0 1.6rem; }
  .stage { background: radial-gradient(ellipse at 50% 42%, color-mix(in oklab, var(--card) 88%, var(--accent)) 0%, var(--card) 62%); border: 1px solid var(--hairline); border-radius: 16px; overflow: hidden; position: relative; }
  canvas#rig { display: block; width: 100%; height: 420px; }
  .statebar { position: absolute; top: .8rem; left: .9rem; font-family: var(--mono); font-size: .72rem; color: var(--ink-soft); background: color-mix(in oklab, var(--card) 82%, transparent); padding: .25rem .6rem; border-radius: 8px; border: 1px solid var(--hairline); }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem 1.2rem; padding: .9rem; border-top: 1px solid var(--hairline); background: var(--card); }
  .g { display: flex; gap: .3rem; align-items: center; flex-wrap: wrap; }
  .l { font-size: .68rem; font-weight: 650; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin-right: .2rem; }
  button { font: 600 .8rem var(--sys); padding: .34rem .7rem; border-radius: 999px; border: 1px solid var(--hairline); background: var(--paper); color: var(--ink); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 1rem; margin-top: 1.4rem; flex-wrap: wrap; }
  .layout { display: flex; gap: 1.4rem; align-items: flex-start; }
  .main { flex: 1; min-width: 0; }
  .side { flex: none; width: 336px; position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; padding-right: 2px; }
  .side::-webkit-scrollbar { width: 6px; }
  .side::-webkit-scrollbar-thumb { background: var(--hairline); border-radius: 3px; }
  .rosterhead { margin: 0 0 0.2rem; font-size: 1.05rem; letter-spacing: -0.01em; }
  .rostersub { margin: 0 0 0.9rem; color: var(--ink-soft); font-size: 0.78rem; }
  .roster { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
  @media (max-width: 1080px) {
    .layout { flex-direction: column; }
    .side { position: static; width: 100%; max-height: none; }
    .roster { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
  .rostercard {
    position: relative;
    background: linear-gradient(180deg, var(--card), color-mix(in srgb, var(--card) 80%, black));
    border: 1px solid var(--hairline); border-radius: 14px;
    padding: 0.55rem 0.45rem 0.5rem;
    display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
    cursor: pointer; transition: border-color .15s, transform .15s;
  }
  .rostercard:hover { border-color: var(--accent); transform: translateY(-3px); }
  .rostercard.picked { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .rostercard canvas { border-radius: 10px; }
  .rostercard .plat { width: 70%; height: 9px; border-radius: 50%; background: radial-gradient(50% 100% at 50% 50%, #00000055, transparent 70%); margin-top: -8px; }
  .rostercard b { font-size: 0.76rem; letter-spacing: -0.01em; margin-top: 0.15rem; }
  .rostercard small { font-size: 0.6rem; color: var(--ink-soft); text-align: center; line-height: 1.25; }
  .sliders { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: .6rem 1.4rem; padding: .9rem; border-top: 1px solid var(--hairline); background: var(--card); }
  .sl { display: flex; align-items: center; gap: .55rem; font-size: .74rem; color: var(--ink-soft); min-width: 0; }
  .sl label { flex: none; width: 5.8rem; font-weight: 600; letter-spacing: .02em; white-space: nowrap; }
  .sl input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .sl output { flex: none; width: 2.8rem; text-align: right; font-family: var(--mono); font-size: .7rem; font-variant-numeric: tabular-nums; }
  .resetrow { padding: .6rem .9rem .9rem; background: var(--card); border-radius: 0 0 16px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>buddykit</h1>
  <p class="sub">Parametric expressive identity for AI companions. One seed + a handful of traits → a living character.</p>

  <div class="layout">
  <div class="main">
  <div class="stage">
    <div class="statebar" id="statebar">state: idle</div>
    <canvas id="rig"></canvas>
    <div class="controls">
      <div class="g"><span class="l">State</span>
        <button class="st" data-v="idle" aria-pressed="true">idle</button>
        <button class="st" data-v="listening">listening</button>
        <button class="st" data-v="working">working</button>
        <button class="st" data-v="needs_you">needs you</button>
        <button class="st" data-v="away">away</button>
        <button id="flare">✦ flare</button>
        <button class="em" data-v="joy">joy</button>
        <button class="em" data-v="surprise">surprise</button>
        <button class="em" data-v="nod">nod</button>
        <button class="em" data-v="shake">shake</button>
        <button class="em" data-v="sad">sad</button>
        <button class="em" data-v="angry">angry</button>
        <button class="em" data-v="tired">tired</button>
        <button class="em" data-v="annoyed">annoyed</button>
      </div>
      <div class="g"><span class="l">Species</span>
        <button class="sp" data-v="emblem" aria-pressed="true">emblem</button>
        <button class="sp" data-v="blob">blob</button>
        <button id="ringchip">⬡ ring</button>
      </div>
      <div class="g"><span class="l">Body</span>
        <button class="bo" data-v="round" aria-pressed="true">round</button>
        <button class="bo" data-v="droplet">droplet</button>
        <button class="bo" data-v="bean">bean</button>
        <button class="bo" data-v="pebble">pebble</button>
        <button class="bo" data-v="squircle">squircle</button>
        <button class="bo" data-v="tri">tri</button>
        <button class="bo" data-v="cloud">cloud</button>
        <button class="bo" data-v="hexy">hexy</button>
      </div>
      <div class="g"><span class="l">Eyes</span>
        <button class="ey" data-v="googly" aria-pressed="true">googly</button>
        <button class="ey" data-v="slit">slit</button>
        <button class="ey" data-v="glint">glint</button>
        <button class="ey" data-v="dot">dot</button>
        <button class="ey" data-v="arc">arc</button>
        <button class="ey" data-v="ring">ring</button>
      </div>
      <div class="g"><span class="l">Extra</span>
        <button class="ac" data-v="none" aria-pressed="true">none</button>
        <button class="ac" data-v="antenna">antenna</button>
        <button class="ac" data-v="sprout">sprout</button>
        <button class="ac" data-v="bow">bow</button>
        <button class="ac" data-v="halo">halo</button>
        <button class="ac" data-v="crown">crown</button>
        <button class="ac" data-v="headset">headset</button>
        <button class="ac" data-v="hardhat">hardhat</button>
        <button class="ac" data-v="tie">tie</button>
        <button class="ac" data-v="glasses">glasses</button>
        <button class="ac" data-v="scarf">scarf</button>
        <button class="ac" data-v="shirt">shirt</button>
        <button class="ac" data-v="hoodie">hoodie</button>
        <button class="ac" data-v="cap">cap</button>
        <button class="ac" data-v="ears">ears</button>
        <button class="ac" data-v="bunny">bunny</button>
        <button class="ac" data-v="cape">cape</button>
        <button class="ac" data-v="toque">toque</button>
        <button class="ac" data-v="mortarboard">mortarboard</button>
        <button class="ac" data-v="stethoscope">stethoscope</button>
        <button class="ac" data-v="badge">badge</button>
        <button class="ac" data-v="toolbelt">toolbelt</button>
        <button class="ac" data-v="tophat">tophat</button>
        <button class="ac" data-v="monocle">monocle</button>
        <button class="ac" data-v="bowtie">bowtie</button>
        <button class="ac" data-v="beanie">beanie</button>
        <button class="ac" data-v="sunglasses">sunglasses</button>
        <button class="ac" data-v="santa">santa</button>
        <button class="ac" data-v="witch">witch</button>
        <button class="ac" data-v="party">party</button>
        <button class="ac" data-v="mane">mane</button>
      </div>
      <div class="g" id="accolors" style="display:none"></div>
      <div class="g"><span class="l">Shell</span>
        <button class="fam" data-v="tetra" aria-pressed="true">tetra</button>
        <button class="fam" data-v="octa">octa</button>
        <button class="fam" data-v="ring">ring</button>
        <button class="fam" data-v="petal">petal</button>
        <button class="fam" data-v="shard">shard</button>
        <button class="fam" data-v="prism">prism</button>
      </div>
      <div class="g"><span class="l">Core</span>
        <button class="co" data-v="sphere" aria-pressed="true">sphere</button>
        <button class="co" data-v="d20">d20</button>
        <button class="co" data-v="cube">cube</button>
        <button class="co" data-v="d12">d12</button>
        <button class="co" data-v="gem">gem</button>
      </div>
      <div class="g"><span class="l">Trust</span>
        <button class="tr" data-v="0.15">strict</button>
        <button class="tr" data-v="0.35" aria-pressed="true">standard</button>
        <button class="tr" data-v="0.55">high</button>
      </div>
      <div class="g"><span class="l">Theme</span>
        <button class="th" data-v="ember" aria-pressed="true">ember</button>
        <button class="th" data-v="sumi">sumi</button>
        <button class="th" data-v="signal">signal</button>
        <input type="color" id="accent" value="#7c5cff" title="one-color theme — themeFromAccent()" style="width:34px;height:30px;border:1px solid var(--hairline);border-radius:8px;background:var(--paper);padding:2px;cursor:pointer">
        <button id="palette-toggle" title="per-element colors">🎨 elements</button>
      </div>
    </div>
    <div class="sliders" id="sliders"></div>
    <div class="sliders" id="palette" style="display:none"></div>
    <div class="resetrow"><button id="reset">reset tuning</button> <button id="copycfg">copy config</button></div>
  </div>
  </div>

  <aside class="side">
    <h2 class="rosterhead">Choose your buddy</h2>
    <p class="rostersub">Click one to take control.</p>
    <div class="roster" id="roster"></div>
  </aside>
  </div>
</div>

<script type="module">
  import { mountBuddy, themeFromAccent, makeTheme, resolveTheme, glowToHex } from "../src/index.ts";

  const statebar = document.getElementById("statebar");
  const buddy = mountBuddy(document.getElementById("rig"), {
    theme: "ember",
    family: "tetra",
    trust: 0.35,
    seed: 42,
    onState: (s) => (statebar.textContent = "state: " + s.replace("_", " ")),
  });

  const press = (sel, cb) => document.querySelectorAll(sel).forEach((b) =>
    b.addEventListener("click", () => {
      document.querySelectorAll(sel).forEach((x) => x.setAttribute("aria-pressed", "false"));
      b.setAttribute("aria-pressed", "true");
      cb(b.dataset.v);
    }));
  press(".st", (v) => buddy.setState(v));
  press(".sp", (v) => buddy.configure({ species: v }));
  // shell ring — independent toggle, mixes with any body/hardness
  const ringchip = document.getElementById("ringchip");
  ringchip.addEventListener("click", () => {
    const on = ringchip.getAttribute("aria-pressed") !== "true";
    ringchip.setAttribute("aria-pressed", String(on));
    buddy.configure({ shell: on });
  });
  press(".bo", (v) => buddy.configure({ body: v }));
  press(".ey", (v) => buddy.configure({ eyes: v }));
  // accessories multi-toggle — combine freely; "none" clears
  const acNone = document.querySelector('.ac[data-v="none"]');
  document.querySelectorAll(".ac").forEach((b) => b.addEventListener("click", () => {
    if (b === acNone) {
      document.querySelectorAll(".ac").forEach((x) => x.setAttribute("aria-pressed", "false"));
      acNone.setAttribute("aria-pressed", "true");
      buddy.configure({ accessories: [] });
      renderAccColors();
      return;
    }
    b.setAttribute("aria-pressed", String(b.getAttribute("aria-pressed") !== "true"));
    const list = [...document.querySelectorAll('.ac[aria-pressed="true"]')]
      .map((x) => x.dataset.v).filter((v) => v !== "none");
    acNone.setAttribute("aria-pressed", String(!list.length));
    buddy.configure({ accessories: list });
    renderAccColors();
  }));
  press(".fam", (v) => buddy.setFamily(v));
  press(".co", (v) => buddy.setCore(v));
  press(".tr", (v) => buddy.setTrust(parseFloat(v)));
  press(".th", (v) => { buddy.setTheme(v); syncPalette(); });
  document.getElementById("accent").addEventListener("input", (e) => {
    document.querySelectorAll(".th").forEach((x) => x.setAttribute("aria-pressed", "false"));
    buddy.configure({ theme: themeFromAccent(e.target.value) });
    syncPalette();
  });

  // ---- per-element palette editor ----
  const ELEMENTS = [
    ["face", "shell face"], ["side", "shell shade"], ["edge", "edge line"],
    ["coreDisc", "core body"], ["eye", "iris"], ["eyeHot", "eye center"],
    ["accent", "tip accent"], ["glow", "glow"],
  ];
  const palette = document.getElementById("palette");
  const pInputs = {};
  for (const [key, label] of ELEMENTS) {
    const row = document.createElement("div");
    row.className = "sl";
    const lab = document.createElement("label");
    lab.textContent = label;
    const inp = document.createElement("input");
    inp.type = "color";
    inp.style.cssText = "flex:1;height:26px;border:1px solid var(--hairline);border-radius:6px;background:var(--paper);padding:1px;cursor:pointer";
    inp.addEventListener("input", () => {
      document.querySelectorAll(".th").forEach((x) => x.setAttribute("aria-pressed", "false"));
      const spec = { base: buddy.getConfig().theme };
      for (const [k] of ELEMENTS) spec[k] = pInputs[k].value;
      buddy.configure({ theme: makeTheme(spec) });
    });
    row.append(lab, inp);
    palette.appendChild(row);
    pInputs[key] = inp;
  }
  function syncPalette() {
    const t = resolveTheme(buddy.getConfig().theme);
    for (const [k] of ELEMENTS) pInputs[k].value = k === "glow" ? glowToHex(t.glow) : t[k];
  }
  syncPalette();
  document.getElementById("palette-toggle").addEventListener("click", () => {
    const open = palette.style.display === "none";
    palette.style.display = open ? "" : "none";
    if (open) syncPalette();
  });
  document.getElementById("flare").addEventListener("click", () => buddy.fire("flare"));
  // one swatch per active accessory — accessoryColors, individually
  const accColorsBox = document.getElementById("accolors");
  function renderAccColors() {
    const cfg = buddy.getConfig();
    accColorsBox.innerHTML = "";
    accColorsBox.style.display = cfg.accessories.length ? "" : "none";
    for (const a of cfg.accessories) {
      const wrap = document.createElement("label");
      wrap.style.cssText = "display:flex;align-items:center;gap:.28rem;font-size:.7rem;color:var(--ink-soft);cursor:pointer";
      const inp = document.createElement("input");
      inp.type = "color";
      const cur = cfg.accessoryColors[a] || "";
      inp.value = /^#[0-9a-fA-F]{6}$/.test(cur) ? cur : "#888888";
      inp.style.cssText = "width:22px;height:22px;border:1px solid var(--hairline);border-radius:6px;background:var(--paper);padding:1px;cursor:pointer";
      inp.addEventListener("input", () =>
        buddy.configure({ accessoryColors: { ...buddy.getConfig().accessoryColors, [a]: inp.value } }));
      const x = document.createElement("button");
      x.textContent = "\u00d7"; x.title = "reset to doctrine color";
      x.style.cssText = "padding:0 .32rem;font-size:.7rem;line-height:1.3";
      x.addEventListener("click", (ev) => {
        ev.preventDefault();
        const c = { ...buddy.getConfig().accessoryColors };
        delete c[a];
        buddy.configure({ accessoryColors: c });
        renderAccColors();
      });
      wrap.append(inp, document.createTextNode(a), x);
      accColorsBox.appendChild(wrap);
    }
  }
  document.querySelectorAll(".em").forEach((b) =>
    b.addEventListener("click", () => buddy.fire(b.dataset.v)));

  // ---- tuning sliders → configure() ----
  const TUNING = [
    ["scale", 0.4, 1.6], ["plateSize", 0.4, 1.8], ["coreSize", 0.5, 1.5],
    ["eyeSize", 0.5, 1.8], ["eyeSpacing", 0.4, 1.8], ["eyeRaise", -0.5, 2.5], ["eyeShift", -1, 1], ["eyeAngle", -90, 90], ["squareness", 0, 1], ["hardness", 0, 1], ["gradient", 0, 1], ["glow", 0, 2.5], ["sparkle", 0, 3],
    ["bob", 0, 2.5], ["tiltiness", 0, 2.5], ["spread", 0, 2],
    ["speed", 0.2, 2.5], ["blinkRate", 0, 3], ["glanceRate", 0, 3],
    ["trust", 0, 1],
  ];
  const sliders = document.getElementById("sliders");
  const inputs = {};
  for (const [key, min, max] of TUNING) {
    const row = document.createElement("div");
    row.className = "sl";
    const lab = document.createElement("label");
    lab.textContent = key;
    const inp = document.createElement("input");
    inp.type = "range"; inp.min = min; inp.max = max; inp.step = 0.01;
    inp.value = buddy.getConfig()[key];
    const out = document.createElement("output");
    out.textContent = Number(inp.value).toFixed(2);
    inp.addEventListener("input", () => {
      out.textContent = Number(inp.value).toFixed(2);
      buddy.configure({ [key]: parseFloat(inp.value) });
    });
    row.append(lab, inp, out);
    sliders.appendChild(row);
    inputs[key] = [inp, out];
  }
  document.getElementById("reset").addEventListener("click", () => {
    const patch = {};
    for (const [key] of TUNING) {
      buddy.configure({ accessoryColors: {} });
      renderAccColors();
      const dv = key === "trust" ? 0.35 : key === "eyeShift" || key === "eyeAngle" || key === "squareness" || key === "hardness" || key === "gradient" ? 0 : 1;
      patch[key] = dv;
      inputs[key][0].value = dv;
      inputs[key][1].textContent = dv.toFixed(2);
    }
    buddy.configure(patch);
  });
  document.getElementById("copycfg").addEventListener("click", async () => {
    await navigator.clipboard.writeText(JSON.stringify(buddy.getConfig(), null, 2));
    document.getElementById("copycfg").textContent = "copied ✓";
    setTimeout(() => (document.getElementById("copycfg").textContent = "copy config"), 1200);
  });

  // ---- the roster: an MMO-style character select of preset beings ----
  // click one to load its full config into the hero above (chips/sliders sync)
  const ROSTER = [
    // first impression: slits — then ghosts — then the cute tier
    { name: "Pip",      cls: "Round Slit · the classic",            cfg: { species: "blob", body: "round", eyes: "slit", theme: "ember", gradient: 0.25, seed: 7 } },
    { name: "Shade",    cls: "Ninja · scarf, horizontal slits",     cfg: { species: "blob", body: "round", eyes: "slit", eyeAngle: 90, theme: "#d6453d", accessories: ["scarf"], seed: 44 } },
    { name: "Vesper",   cls: "Ghost · petal shell, gem core",       cfg: { species: "emblem", family: "petal", core: "gem", theme: "sumi", seed: 12 } },
    { name: "Tetra",    cls: "Ghost · tetra shell, d20 core",       cfg: { species: "emblem", family: "tetra", core: "d20", theme: "ember", seed: 5 } },
    { name: "Boxy",     cls: "Square · headset, on call",           cfg: { species: "blob", body: "round", eyes: "slit", squareness: 1, gradient: 0.35, theme: "#e07a2f", accessories: ["headset"], seed: 66 } },
    { name: "Cubit",    cls: "Construct · hard core + shell ring",  cfg: { species: "blob", body: "round", eyes: "slit", hardness: 1, shell: true, core: "cube", family: "petal", theme: "#5b5763", gradient: 0.35, seed: 55 } },
    { name: "Sage",     cls: "The original · mane, first adopter tribute", cfg: { species: "blob", body: "round", eyes: "googly", squareness: 1, theme: "#7d9b90", accessories: ["mane"], eyeSpacing: 0.85, seed: 3 } },
    { name: "Sterling", cls: "Gentleman · cape, tophat, monocle",   cfg: { species: "blob", body: "round", eyes: "slit", theme: "#8a7cf0", accessories: ["cape", "tophat", "monocle"], seed: 33 } },
    { name: "Foreman",  cls: "Builder · square-ish, hardhat",       cfg: { species: "blob", body: "squircle", eyes: "slit", squareness: 0.6, theme: "#e0a12f", accessories: ["hardhat", "toolbelt"], seed: 90 } },
    { name: "Whiskers", cls: "Feline · ears + bowtie",              cfg: { species: "blob", body: "round", eyes: "googly", theme: "#e07a2f", accessories: ["ears", "bowtie"], accessoryColors: { bowtie: "#d6453d" }, seed: 21 } },
    { name: "Doc",      cls: "Medic · stethoscope + badge",         cfg: { species: "blob", body: "round", eyes: "arc", theme: "#7fb069", accessories: ["stethoscope", "badge"], seed: 72 } },
    { name: "Sous",     cls: "Chef · toque",                        cfg: { species: "blob", body: "bean", eyes: "dot", theme: "#4fb8a8", accessories: ["toque"], seed: 61 } },
    { name: "Hopps",    cls: "Bunny · party regular",               cfg: { species: "blob", body: "round", eyes: "googly", theme: "#e07aa8", accessories: ["bunny", "party"], seed: 101 } },
  ];
  const roster = document.getElementById("roster");
  for (const being of ROSTER) {
    const card = document.createElement("div");
    card.className = "rostercard";
    const c = document.createElement("canvas");
    c.style.width = "104px"; c.style.height = "96px";
    card.appendChild(c);
    const plat = document.createElement("div");
    plat.className = "plat";
    card.appendChild(plat);
    const nm = document.createElement("b");
    nm.textContent = being.name;
    card.appendChild(nm);
    const cl = document.createElement("small");
    cl.textContent = being.cls;
    card.appendChild(cl);
    roster.appendChild(card);
    const mini = mountBuddy(c, being.cfg);
    card.addEventListener("mouseenter", () => mini.setState("listening"));
    card.addEventListener("mouseleave", () => mini.setState("idle"));
    card.addEventListener("click", () => {
      document.querySelectorAll(".rostercard").forEach((x) => x.classList.remove("picked"));
      card.classList.add("picked");
      adoptConfig(mini.getConfig());
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  }

  // load a full config into the hero and sync every control to it
  function adoptConfig(cfg) {
    buddy.configure(cfg);
    const pressGroup = (sel, val) => document.querySelectorAll(sel).forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.v === String(val))));
    pressGroup(".sp", cfg.species);
    pressGroup(".bo", cfg.body);
    pressGroup(".ey", cfg.eyes);
    pressGroup(".fam", cfg.family);
    pressGroup(".co", cfg.core);
    document.querySelectorAll(".ac").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.v === "none" ? cfg.accessories.length === 0 : cfg.accessories.includes(b.dataset.v))));
    ringchip.setAttribute("aria-pressed", String(!!cfg.shell));
    for (const [key] of TUNING) {
      if (typeof cfg[key] === "number" && inputs[key]) {
        inputs[key][0].value = cfg[key];
        inputs[key][1].textContent = Number(cfg[key]).toFixed(2);
      }
    }
    renderAccColors();
  }
</script>
</body>
</html>
